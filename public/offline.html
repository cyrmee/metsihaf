<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Metsihaf</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcfcfc;
        --fg: #2b2b2b;
        --muted: #6b6b6b;
        --primary: #a52018;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a1018;
          --fg: #f3efe6;
          --muted: #9a9a9a;
          --primary: #e55647;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 500;
        font-size: 0.875rem;
        color: #fdf8ef;
        background: var(--primary);
        border: none;
        padding: 0.6rem 1.25rem;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Metsihaf couldn't reach the network. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
