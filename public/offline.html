<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Metsihaf</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17201d;
        --paper: #f7f4ec;
        --paper-deep: #e9e5da;
        --paper-white: #fffdf7;
        --rule: #aca99f;
        --muted: #62665f;
        --signal: #a34527;
        --signal-hover: #84351d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ece8de;
          --paper: #1c231f;
          --paper-deep: #141a17;
          --paper-white: #232a25;
          --rule: #4a5049;
          --muted: #9a9d94;
          --signal: #e0836a;
          --signal-hover: #ef9c85;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--paper-deep);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--ink);
        background:
          linear-gradient(rgba(23, 32, 29, 0.035) 1px, transparent 1px),
          var(--paper-deep);
        background-size: 100% 32px;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .sheet {
        width: 100%;
        max-width: 360px;
        border: 1px solid var(--ink);
        background: var(--paper);
        box-shadow: 10px 10px 0 rgba(23, 32, 29, 0.11);
      }
      .sheet-heading {
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--ink);
        padding: 14px 20px;
      }
      .sheet-index {
        color: var(--signal);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .sheet-body {
        padding: 28px 20px 24px;
      }
      h1 {
        margin: 0 0 10px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      button {
        display: block;
        width: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--paper-white);
        background: var(--signal);
        border: none;
        border-radius: 0;
        padding: 13px 16px;
        cursor: pointer;
      }
      button:hover {
        background: var(--signal-hover);
      }
      button:focus-visible {
        outline: 3px solid #e7a978;
        outline-offset: 3px;
      }
      .footer {
        border-top: 1px solid var(--rule);
        padding: 10px 20px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="sheet-heading">
        <span class="sheet-index">Status / Offline</span>
      </div>
      <div class="sheet-body">
        <h1>No connection</h1>
        <p>
          This page hasn't been opened while online before, so it isn't stored on this device
          yet. Chapters you've downloaded stay readable — go back or try this page again once
          you're back online.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
      <div class="footer">Metsihaf — Offline fallback</div>
    </div>
  </body>
</html>
